[package]
name = "lyra"
version = "0.2.0-dev.2"
edition = "2024"
rust-version = "1.99"
description = "Offline coding agent with a native desktop app and CLI"
repository = "https://github.com/DraimCiDo/Lyra"
publish = false
default-run = "lyra"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40.0", default-features = false, features = ["system", "disk", "gpu"] }
llama-cpp-2 = { version = "=0.1.160", default-features = false }
ctrlc = "3"
encoding_rs = "0.8"
cap-std = "=3.4.6"
ignore = "0.4"

eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "clipboard"], optional = true }
egui_extras = { version = "=0.37.0", default-features = false, features = ["svg"], optional = true }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"], optional = true }
tempfile = { version = "=3.27.0", optional = true }

[target.'cfg(windows)'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu_no_default_features"], optional = true }

wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "std", "wgsl"], optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.34", optional = true }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "x11", "wayland"], optional = true }

[[bin]]
name = "lyra-desktop"
path = "src/bin/lyra-desktop.rs"
required-features = ["desktop"]

[[example]]
name = "render-icon"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:winresource", "dep:egui_extras", "dep:eframe", "dep:rfd", "dep:tempfile", "dep:wgpu"]
cuda = ["llama-cpp-2/cuda"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"
