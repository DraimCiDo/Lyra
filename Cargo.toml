[package]
name = "lyra"
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.99"
description = "Local-first coding agent: CLI foundation and offline hardware diagnostics"
repository = "https://github.com/DraimCiDo/Lyra"
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40.0", default-features = false, features = ["system", "disk", "gpu"] }
llama-cpp-2 = { version = "=0.1.160", default-features = false }
ctrlc = "3"
encoding_rs = "0.8"

[features]
default = []
cuda = ["llama-cpp-2/cuda"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"
