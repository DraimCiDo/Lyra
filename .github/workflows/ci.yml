name: CLI checks and Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - '**/*.md'
      - '.editorconfig'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: lyra
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: lyra.exe
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      - name: Reuse native runtime build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.m2/repository
            target
          key: lyra-native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: lyra-native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Native inference build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev xvfb libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Native inference build dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $clang = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path -LiteralPath "$clang\libclang.dll")) { throw 'LLVM libclang is missing' }
          "LIBCLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features desktop --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --features desktop --locked
      - name: Explicit real CPU inference smoke (tiny GGUF)
        run: |
          $model = Join-Path $env:RUNNER_TEMP 'lyra-stories260K.gguf'
          Invoke-WebRequest -Uri 'https://huggingface.co/ggml-org/models/resolve/499bc8821c6b12b4e53c5bffcb21ec206f212d81/tinyllamas/stories260K.gguf' -OutFile $model
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $model).Hash.ToLowerInvariant()
          if ($hash -ne '270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d') { throw 'Test model checksum mismatch' }
          $env:LYRA_TEST_MODEL = $model
          cargo test --locked --features desktop --test inference -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath $model
      - name: Release build
        run: cargo build --release --locked --features desktop --bins --target ${{ matrix.target }}
      - name: Set up full JDK 21 for trusted starter acceptance
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node 24 for dependency-free TypeScript starter
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Compile trusted Minecraft starters and test Python/TypeScript starters
        timeout-minutes: 8
        run: python tools/verify_starters.py --binary ./target/${{ matrix.target }}/release/${{ matrix.binary }} --minecraft
      - name: Smoke test built binary
        run: |
          $binary = './target/${{ matrix.target }}/release/${{ matrix.binary }}'
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $json = & $binary doctor --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = $json | ConvertFrom-Json
          if ($report.schema_version -ne 1 -or $report.inference_status -ne 'runtime_available_cpu') {
            throw 'Unexpected diagnostic report'
          }
      - name: Open and render desktop window (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./target/${{ matrix.target }}/release/lyra-desktop --smoke-test
      - name: Open and render desktop window (Windows)
        if: runner.os == 'Windows'
        run: |
          $app = Start-Process -FilePath './target/${{ matrix.target }}/release/lyra-desktop.exe' -ArgumentList '--smoke-test' -RedirectStandardError desktop-smoke.err -RedirectStandardOutput desktop-smoke.out -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Desktop smoke timed out' }
          if ($app.ExitCode -ne 0) { Get-Content -LiteralPath desktop-smoke.err; throw "Desktop smoke failed: $($app.ExitCode)" }
      - name: Collect build files and dependency licenses
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath './target/${{ matrix.target }}/release/${{ matrix.binary }}' -Destination dist
          $desktop = if ($IsWindows) { "lyra-desktop.exe" } else { "lyra-desktop" }
          Copy-Item -LiteralPath "./target/${{ matrix.target }}/release/$desktop" -Destination dist
          Copy-Item -LiteralPath docs/DISTRIBUTION.md -Destination dist/README.md
          "`nSource commit: https://github.com/DraimCiDo/Lyra/tree/$env:GITHUB_SHA" | Add-Content -Encoding utf8NoBOM -LiteralPath dist/README.md
          Copy-Item -LiteralPath Cargo.lock -Destination dist
          New-Item -ItemType Directory -Force -Path dist/docs, dist/examples | Out-Null
          Copy-Item -LiteralPath docs/ACCEPTANCE.md, docs/LOCAL_MODELS.md, docs/DESKTOP.md, docs/UPDATES.md, docs/PROJECTS.md, docs/KNOWLEDGE.md -Destination dist/docs
          Copy-Item -LiteralPath examples/buggy-add -Destination dist/examples -Recurse
          python tools/collect_licenses.py --features desktop --target ${{ matrix.target }} --output dist/THIRD_PARTY_NOTICES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hashes = @('${{ matrix.binary }}', $desktop) | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/$_").Hash.ToLowerInvariant()
            "$hash  $_"
          }
          $hashes | Set-Content -Encoding utf8NoBOM -LiteralPath dist/SHA256SUMS.txt
      - name: Build Windows update package
        if: runner.os == 'Windows'
        run: python tools/package_update.py --verify-executables
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lyra-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows update assets
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lyra-update-x86_64-pc-windows-msvc
          path: release/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Prepare draft Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lyra-update-x86_64-pc-windows-msvc
          path: release
      - name: Validate tag and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must match Cargo package version')
          pathlib.Path('release-notes.md').write_text(
              'Portable Windows x64 CPU build. Download the ZIP and its SHA256 sidecar.\n\n'
              'Extract the complete ZIP for the first installation. Models are supplied separately. '
              'Microsoft VC++ v14 x64 runtime is required.\n\n'
              'Update protocol and recovery: https://github.com/DraimCiDo/Lyra/blob/main/docs/UPDATES.md\n'
              'This draft requires review before publication. Native CI does not validate CUDA or model quality on the user PC.\n'
          )
          PY
      - name: Create draft (publication is manual)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release/lyra-windows-x86_64.zip release/lyra-windows-x86_64.zip.sha256 --verify-tag --draft "${flags[@]}" --title "Lyra $RELEASE_TAG" --notes-file release-notes.md
