name: Secret scan
# Replaces GitHub secret scanning, which is unavailable for private repositories on the free plan.
# The scanner runs from a digest-pinned image over an explicit Git range, so every commit of a
# pull request is scanned (an API-listed commit range is paginated and can stop at 30 commits).
# Review findings before treating them as leaks.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # gitleaks v8.30.1
  GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the commits of this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          git cat-file -e "${HEAD_SHA}^{commit}"
          range="$HEAD_SHA"
          if [ -n "${BASE_SHA:-}" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA"
            range="${BASE_SHA}..${HEAD_SHA}"
          fi
          echo "Scanning ${range}"
          docker run --rm -v "$PWD":/repo:ro --entrypoint sh "$GITLEAKS_IMAGE" -c \
            'git config --global --add safe.directory /repo && gitleaks git /repo --log-opts="$0" --redact --no-banner --exit-code 2' "$range"
