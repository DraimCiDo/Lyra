name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write  # lets the labeler create labels that do not exist yet

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # No checkout of PR code: pull_request_target runs with write permissions.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
